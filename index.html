<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Dumpling Party</title>
<!-- Playgama Bridge: сохранения, пауза, звук и реклама через SDK площадки. Без интернета игра работает и без него -->
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Макет: полноэкранная сцена из трёх слоёв (неоновый фон и декор 2D → дамплинг WebGL → эффекты 2D)
   и тонкий HUD поверх. Один осознанный тёмный неоновый новогодний вид для обеих тем. */
:root{
  color-scheme: dark;
  --night:#06101f;
  --plum:#0e2340;
  --ink:#081224;
  --pumpkin:#e8283c;
  --pumpkin-hi:#ffd36b;
  --candle:#ffd36b;
  --slime:#7fe0ff;
  --bone:#f4f8ff;
  --bone-soft:rgba(226,238,255,.74);
  --blood:#e0263f;
  --font-display:"Rubik Wet Paint","Rubik","Arial Black",system-ui,sans-serif;
  --font-ui:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-hand:"Pangolin","Comic Sans MS","Rubik",cursive,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}

/* под кнопками — ледяные капли (::before); вся игра живёт в #app: на компьютере он не шире 2:1, на очень широком окне по бокам остаются поля (ширину и сдвиг ставит resize).
   transform делает #app рамкой для всех position:fixed внутри — HUD, экраны и карточки держатся сцены, а не окна */
#app{position:fixed;top:0;bottom:0;left:0;width:100%;overflow:hidden;transform:translate(0,0)}
#stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#stage.grab{cursor:grabbing}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.hud-row{display:flex;align-items:center;gap:10px;min-width:0}
.chip{display:flex;align-items:baseline;gap:8px;min-width:0;padding:7px 14px 8px;border-radius:999px;background:rgba(6,16,36,.72);border:2px solid rgba(255,211,107,.55);box-shadow:0 0 18px rgba(255,211,107,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip .lv{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin-hi);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .nm{font-weight:800;font-size:1rem;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
/* на узком экране слово «Уровень» не помещается рядом с четырьмя кнопками — остаётся «4/10» */
@media (max-width:430px){.chip .lw{display:none}}
/* на узком экране плашка в две строки: номер уровня сверху, имя дамплинга целиком снизу */
@media (max-width:520px){.chip{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 14px 6px;border-radius:18px}.chip .lv{font-size:.68rem;letter-spacing:.1em}.chip .nm{font-size:.92rem;max-width:100%}.hud .hud-row{gap:8px}.hud .ib{width:40px;height:40px}}
.ib{pointer-events:auto;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(6,16,36,.72);border:2px solid rgba(255,211,107,.55);color:var(--pumpkin-hi);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .12s,box-shadow .2s}
.ib svg{width:22px;height:22px;display:block}
.ib:hover{box-shadow:0 0 16px rgba(255,211,107,.55)}
.ib:active{transform:scale(.92)}
.ib.off{color:rgba(246,236,217,.4);border-color:rgba(246,236,217,.25)}
.ib:focus-visible,.btn:focus-visible,.lang:focus-visible{outline:3px solid var(--slime);outline-offset:3px}

.meter{position:relative;height:30px;border-radius:999px;background:rgba(6,16,36,.78);border:2px solid rgba(255,211,107,.55);overflow:hidden;max-width:560px;width:100%;align-self:center;box-shadow:0 0 22px rgba(255,60,40,.18)}
.meter .fill{position:absolute;inset:3px auto 3px 3px;width:0;border-radius:999px;
  background:linear-gradient(90deg,#7dff5a 0%,#ffd84a 45%,#ff7a1a 70%,#ff2a4a 100%);background-size:540px 100%;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25);transition:width .18s cubic-bezier(.3,1.6,.5,1)}
.meter .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 10px,transparent 10px 22px);animation:ooze 1.2s linear infinite}
@keyframes ooze{to{background-position:44px 0}}
.meter .ml{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:900;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 2px #000,0 0 6px #000}
.meter .mv{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:900;font-size:.8rem;color:var(--bone);text-shadow:0 1px 2px #000,0 0 6px #000;font-variant-numeric:tabular-nums}
.meter.hot{animation:throb .35s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 30px rgba(255,40,60,.75);border-color:#ff3a4a}}
.stam{display:flex;align-items:center;gap:8px;align-self:center;font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-soft)}
.stam .bar{width:120px;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.stam .bar i{display:block;height:100%;width:100%;background:var(--slime);border-radius:inherit;transition:width .2s}

.hint{position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:max-content;max-width:calc(100% - 32px);
  padding:10px 18px;border-radius:16px;background:rgba(6,16,36,.7);border:1.5px solid rgba(246,236,217,.18);
  font-weight:700;font-size:.95rem;line-height:1.35;text-align:center;text-wrap:balance;color:var(--bone);
  opacity:0;transition:opacity .35s}
.hint.show{opacity:1}

.bubble{position:fixed;z-index:4;pointer-events:none;left:0;top:0;transform:translate(-50%,-100%) scale(.6);opacity:0;
  padding:8px 14px;border-radius:16px;background:var(--bone);color:var(--ink);font-weight:900;font-size:1rem;white-space:nowrap;
  border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:opacity .2s,transform .25s cubic-bezier(.3,1.7,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
.bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}

/* ---------- экраны ---------- */
.screen{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  padding-block:calc(env(safe-area-inset-top,0px) + 6vh) calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* заставка начинается ниже ряда кнопок сверху (44 px + отступ), чтобы заголовок не наезжал на них на узком окне */
#title{padding-top:max(calc(env(safe-area-inset-top,0px) + 6vh), calc(env(safe-area-inset-top,0px) + 68px))}
/* низкий экран (телефон лёжа): заголовок меньше, подсказка про декор скрыта, кнопки плотнее — всё помещается */
@media (max-height:480px){#title{padding-top:calc(env(safe-area-inset-top,0px) + 58px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}#title .logo span:first-of-type{font-size:min(9vw,10vh)}#title .logo span:last-of-type{font-size:min(11vw,12.5vh)}#title .tag{margin-top:6px;font-size:.7rem}#title .tag2{display:none}#title .title-foot{gap:8px}#title .btn{padding:10px 24px 11px}}
.screen .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;font-family:var(--font-display);font-weight:400;line-height:.86;text-align:center;letter-spacing:.01em}
.logo span{display:block;background:linear-gradient(180deg,#ffe4e6 0%,#ff7a86 38%,#e8283c 70%,#9a0c1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 22px rgba(255,80,90,.55))}
.logo span:first-of-type{font-size:clamp(2.6rem,9vw,5.2rem)}
.logo span:last-of-type{font-size:clamp(2.8rem,11vw,6.6rem);background:linear-gradient(180deg,#ffffff 0%,#dff4ff 35%,#86d4ff 70%,#2a7ad0 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 22px rgba(255,211,107,.45))}
.tag{margin:14px 0 0;padding:3px 12px 3px calc(12px + .3em);border-radius:999px;background:rgba(6,16,36,.55);font-weight:800;font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-soft);text-align:center;text-shadow:0 1px 4px #000}
.tag2{margin:10px 0 0;max-width:28rem;padding:6px 14px;border-radius:12px;background:rgba(6,16,36,.6);font-weight:700;font-size:.92rem;line-height:1.4;color:var(--bone-soft);text-align:center;text-wrap:balance;text-shadow:0 1px 6px #000}
.title-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
/* в портрете кнопки HUD над логотипом: опускаем заставку ниже их ряда (44px + отступ 12px) */
@media (max-aspect-ratio:1/1){#title{padding-top:calc(env(safe-area-inset-top,0px) + max(6vh,68px))}}
.best{font-weight:700;font-size:.85rem;color:var(--bone-soft);text-align:center}

.btn{position:relative;pointer-events:auto;cursor:pointer;min-width:170px;padding:15px 30px 16px;border-radius:22px;
  font-family:var(--font-ui);font-weight:900;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;color:#fff8f0;text-shadow:0 2px 0 rgba(80,0,10,.6);
  background:linear-gradient(180deg,#ff8a90 0%,#e8283c 45%,#a8101f 100%);border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(90,0,15,.4),0 0 28px rgba(255,80,90,.45);
  transition:transform .1s,box-shadow .1s,filter .2s}
.btn::before{content:"";position:absolute;left:18%;right:18%;bottom:-14px;height:16px;pointer-events:none;
  background:radial-gradient(7px 9px at 12% 20%,#dff4ff 96%,transparent) ,radial-gradient(5px 13px at 48% 30%,#dff4ff 96%,transparent),radial-gradient(6px 8px at 82% 18%,#dff4ff 96%,transparent);
  filter:drop-shadow(0 2px 0 var(--ink))}
.btn:hover{filter:brightness(1.08) saturate(1.1)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(90,0,15,.4),0 0 18px rgba(255,80,90,.4)}
.btn.ghost{color:var(--bone);background:linear-gradient(180deg,#3fae6c 0%,#1f6b3f 55%,#0f3d24 100%);
  box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25),inset 0 -5px 0 rgba(0,0,0,.3),0 0 24px rgba(70,200,120,.35)}
.btn.ghost::before{background:radial-gradient(7px 9px at 12% 20%,#dff4ff 96%,transparent),radial-gradient(5px 13px at 48% 30%,#dff4ff 96%,transparent),radial-gradient(6px 8px at 82% 18%,#dff4ff 96%,transparent)}
.btn.slime{color:#2a1a00;background:linear-gradient(180deg,#fff6c0 0%,#ffd34a 45%,#e0a20e 100%);box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(120,70,0,.3),0 0 28px rgba(255,211,107,.4)}
.btn.slime::before{background:radial-gradient(7px 9px at 12% 20%,#dff4ff 96%,transparent),radial-gradient(5px 13px at 48% 30%,#dff4ff 96%,transparent),radial-gradient(6px 8px at 82% 18%,#dff4ff 96%,transparent)}

.lang{pointer-events:auto;cursor:pointer;padding:7px 14px;border-radius:999px;background:rgba(6,16,36,.6);border:1.5px solid rgba(246,236,217,.25);font-weight:800;font-size:.75rem;letter-spacing:.14em}
.title-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bgsw{color:var(--bone);letter-spacing:.06em}
.bgsw b{color:var(--pumpkin-hi);font-weight:900}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--pumpkin-hi)}

.card{position:fixed;left:50%;top:42%;z-index:7;pointer-events:none;transform:translate(-50%,-50%);width:min(92vw,520px);text-align:center;
  padding:22px 22px 24px;border-radius:28px;background:radial-gradient(circle at 50% 0%,rgba(255,211,107,.25),transparent 70%),rgba(6,16,36,.86);border:3px solid var(--pumpkin);
  box-shadow:0 0 50px rgba(255,80,90,.4),0 10px 0 var(--ink);animation:cardIn .5s cubic-bezier(.3,1.6,.5,1)}
.card.out{animation:cardOut .35s ease-in forwards}
@keyframes cardIn{from{transform:translate(-50%,-50%) scale(.4) rotate(-6deg);opacity:0}}
@keyframes cardOut{to{transform:translate(-50%,-50%) scale(.7);opacity:0}}
.card .cl{font-weight:900;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--pumpkin-hi)}
.card .cn{margin-top:6px;font-family:var(--font-display);font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;color:var(--bone);text-shadow:0 4px 0 var(--ink),0 0 20px rgba(255,255,255,.25)}
.card .cs{margin-top:12px;font-weight:700;font-size:1rem;line-height:1.4;color:var(--bone-soft);text-wrap:balance}
.card .cs b{color:var(--slime)}
.card .cs svg{width:28px;height:18px;vertical-align:-3px}

.grave-ui{justify-content:flex-end;gap:16px}
.epi{pointer-events:none;max-width:34rem;text-align:center;font-family:var(--font-hand);font-size:clamp(1.05rem,3.6vw,1.35rem);line-height:1.35;color:var(--bone);text-shadow:0 2px 8px #000,0 0 2px #000;text-wrap:balance}
.epi small{display:block;margin-top:4px;font-family:var(--font-ui);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-soft)}
.epi .epi-next{display:block;margin-top:8px;color:var(--slime)}
/* 1.0.8: праздничная плашка, ×2 за рекламу, подарок дня, задания, рекорды */
.event{margin:10px 0 0;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,rgba(255,211,107,.32),rgba(255,79,139,.32));border:2px solid rgba(255,179,71,.85);font-weight:900;font-size:.85rem;color:#ffe2a8;text-align:center;box-shadow:0 0 18px rgba(255,211,107,.45);text-shadow:0 1px 4px #000}
.x2{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:2px solid var(--ink);background:linear-gradient(180deg,#fff3a0,#ffc21a);color:#2a1400;font-weight:900;font-size:.95rem;box-shadow:0 4px 0 var(--ink),0 0 18px rgba(255,210,60,.5);animation:btnPulse 1.4s ease-in-out infinite}
.x2 svg{width:24px;height:15px}
.panel-box{width:min(560px,100%)}
.panel-body{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;padding:2px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid rgba(246,236,217,.12);font-size:.8rem;color:var(--bone-soft)}
.day b{font-weight:900;color:var(--bone)}
.day .dv{display:flex;align-items:center;gap:3px;font-weight:900;color:var(--bone)}
.day svg{width:20px;height:13px}
.day canvas{width:58px;height:58px}
.day.big{grid-column:span 2;flex-direction:row;gap:8px}
.day.today{border-color:var(--pumpkin);box-shadow:0 0 16px rgba(255,211,107,.5);background:rgba(255,211,107,.14)}
.day.done{opacity:.45}
.ibtn.big{align-self:center;min-width:200px;padding:11px 22px;font-size:1.05rem}
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid rgba(246,236,217,.12)}
.quest.done{border-color:var(--slime);background:rgba(127,224,255,.08)}
.qmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.qt{flex:1;font-weight:800;font-size:.92rem;color:var(--bone);line-height:1.25}
.qmain small{font-size:.75rem;font-weight:700;color:var(--bone-soft)}
.qbar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pumpkin),var(--slime));border-radius:inherit}
.qpay{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--pumpkin-hi);white-space:nowrap}
.qpay svg{width:22px;height:14px}
.quest.done .qpay{color:var(--slime);font-size:1.3rem}
.ptitle{margin:6px 0 0;font-weight:900;font-size:.95rem;color:#ffd34a}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.album canvas{width:100%;aspect-ratio:1;border-radius:10px;background:rgba(0,0,0,.25);filter:grayscale(1) brightness(.35)}
.album canvas.got{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.08);box-shadow:0 0 12px rgba(255,210,60,.6)}
.toplist{display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent}
.toprow.me{border-color:var(--slime)}
.toprow .tr{min-width:2em;color:var(--pumpkin-hi)}
.toprow .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bone);font-weight:800}
.toprow .ts{font-weight:900;color:#ffd34a}
.qtoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:8;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:999px;background:rgba(6,16,36,.9);border:2px solid var(--slime);color:var(--bone);font-weight:900;font-size:.95rem;white-space:nowrap;box-shadow:0 0 20px rgba(127,224,255,.4);transition:opacity .25s,transform .25s}
.qtoast.show{opacity:1;transform:translate(-50%,0)}
.epi .epi-gold{display:block;margin-top:6px;font-family:var(--font-ui);font-weight:900;font-size:.85rem;color:#ffd34a}
/* телефон лёжа: надпись и кнопки под ёлкой компактнее */
@media (max-height:560px){.grave-ui{gap:8px}.epi{font-size:1rem;line-height:1.25}.epi small{font-size:.68rem;margin-top:2px}.epi-candy{margin-top:4px;padding:2px 10px;font-size:.9rem}#graveBtns .btn{padding:10px 18px 11px;font-size:.92rem}}
/* на телефоне кнопки под ёлкой в два ряда: «Следующий» во всю ширину, «Магазин» и «Меню» рядом — ёлке остаётся больше места */
@media (max-width:520px){.grave-ui{gap:12px}#graveBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;width:100%;max-width:380px}#graveBtns #bNext{grid-column:1/-1;font-size:1rem}#graveBtns .btn{min-width:0;padding:12px 4px 13px;font-size:.8rem;letter-spacing:.03em}}

.flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
.btn.pulse{animation:btnPulse 1.1s ease-in-out infinite}
@keyframes btnPulse{50%{transform:scale(1.06);filter:brightness(1.12)}}
/* ---------- конфеты, комбо, магазин (1.0.6) ---------- */
.hud-row2{display:flex;align-items:center;gap:8px;min-width:0}
.hud.on-title .hud-row2{display:none}
.hud-row2 .meter{flex:1 1 auto;min-width:0;align-self:auto}
.candy{flex:none;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:rgba(6,16,36,.78);border:2px solid rgba(255,79,139,.65);font-weight:900;font-size:1rem;color:var(--bone);font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.candy svg{width:28px;height:18px;display:block}
.candy.bump{animation:candyBump .35s ease-out}
@keyframes candyBump{40%{transform:scale(1.2)}}
.combo{flex:none;padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,#ffe36b,#ff9a1e);color:#2a0a00;font-weight:900;font-size:1rem;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.combo.pop{animation:comboPop .3s cubic-bezier(.3,1.7,.5,1)}
@keyframes comboPop{from{transform:scale(.4)}}
.shopbtn{display:inline-flex;align-items:center;gap:6px;color:var(--bone);border-color:rgba(255,79,139,.7)}
.shopbtn svg{width:24px;height:15px}
.epi-candy{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 12px;border-radius:999px;background:rgba(255,79,139,.18);border:1.5px solid rgba(255,79,139,.6);font-family:var(--font-ui);font-weight:900;font-size:1rem;color:var(--bone)}
.epi-candy svg{width:24px;height:15px}
.shop{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(8,3,14,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.shop-box{position:relative;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;border-radius:24px;
  background:radial-gradient(circle at 50% 0%,rgba(255,211,107,.22),transparent 60%),#0c1a33;border:3px solid var(--pumpkin);box-shadow:0 0 40px rgba(255,80,90,.35),0 8px 0 var(--ink)}
.shop-head{display:flex;align-items:center;gap:10px}
.shop-head h2{margin:0;flex:1;min-width:0;font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--pumpkin-hi);text-shadow:0 3px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{cursor:pointer;padding:8px 14px;border-radius:999px;border:2px solid rgba(246,236,217,.25);background:rgba(255,255,255,.06);font-weight:800;font-size:.88rem;color:var(--bone-soft)}
.tab.on{background:var(--pumpkin);color:#fff8f0;border-color:var(--ink)}
.tab:focus-visible,.ibtn:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
.shop-note{margin:0;font-weight:600;font-size:.85rem;line-height:1.35;color:var(--bone-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;min-height:0;padding:2px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:16px;background:rgba(255,255,255,.05);border:2px solid rgba(246,236,217,.12)}
.item.on{border-color:var(--slime);box-shadow:0 0 14px rgba(127,224,255,.35)}
.item canvas{width:100%;max-width:120px;aspect-ratio:1;border-radius:12px;background:rgba(0,0,0,.25)}
.item canvas.wide{max-width:none;aspect-ratio:16/9}
.iname{font-weight:800;font-size:.9rem;text-align:center;color:var(--bone);line-height:1.2}
.idesc{font-size:.75rem;text-align:center;color:var(--bone-soft);line-height:1.3}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:120px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}.dots i.f{background:var(--slime)}
.item.secret{border-style:dashed;border-color:rgba(255,226,122,.45)}
.shop-note .got{color:var(--pumpkin-hi);white-space:nowrap}
#bShop.deal,#bShop2.deal{position:relative}
#bShop.deal::after,#bShop2.deal::after{content:'';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--slime);border:2px solid var(--ink);box-shadow:0 0 10px var(--slime)}
.ibtn{cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;min-width:100px;margin-top:auto;padding:7px 12px;border-radius:999px;border:2px solid var(--ink);background:linear-gradient(180deg,#fff3b0,#e0a20e);color:#2a1a00;font-weight:900;font-size:.92rem;box-shadow:0 3px 0 var(--ink)}
.ibtn svg{width:22px;height:14px}
.ibtn.poor{filter:grayscale(.75) brightness(.8)}
.ibtn:disabled{cursor:default;background:rgba(255,255,255,.12);color:var(--bone-soft);box-shadow:none;border-color:rgba(246,236,217,.2)}
.ibtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:8px 14px;border-radius:12px;background:var(--bone);color:var(--ink);font-weight:800;font-size:.9rem;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.meter .fill::after{animation:none}.card{animation:none}.btn.pulse{animation:none}.candy.bump,.combo.pop{animation:none}}

/* 1.2.0: неоновый интерфейс — тёмное стекло, по краю светящаяся трубка (белая середина, цветное свечение), буквы с подсветкой.
   Цвет трубки задаёт --nc у каждого элемента. */
:root{--font-display:"Rubik","Arial Black",system-ui,sans-serif;--night:#0b0620;--ink:#0a0420;--pumpkin:#ff4fd8;--pumpkin-hi:#ffe45a;--slime:#22e5ff;
  --bone:#fff6ff;--bone-soft:rgba(240,228,255,.8);--n-cyan:#22e5ff;--n-pink:#ff4fd8;--n-yellow:#ffe45a;--n-green:#3dff9a;--n-violet:#b06bff;--glass:rgba(20,6,40,.68)}
.btn,.ib,.chip,.candy,.lang,.tag2,.hint,.meter,.event,.x2,.combo,.ibtn,.tab,.item,.day,.quest,.toprow,.card,.shop-box,.qtoast,.toast,.bubble,.epi-candy{
  --nc:var(--n-violet);--tube:color-mix(in srgb,var(--nc) 62%,#fff);--halo:color-mix(in srgb,var(--nc) 50%,transparent)}
/* название — неоновая вывеска на холсте (logoLine); строки остаются для размеров и читалок экрана */
.logo{position:relative;font-weight:900;letter-spacing:0;line-height:.92}
.logo span{background:none;color:#fff;filter:none;text-shadow:0 0 10px var(--n-cyan),0 0 26px var(--n-cyan)}
.logo span:first-of-type{margin-bottom:.04em;font-size:clamp(2.6rem,min(9vw,11vh),5.2rem)}
.logo span:last-of-type{margin-bottom:.06em;font-size:clamp(2.8rem,min(11vw,13vh),6.6rem);text-shadow:0 0 10px var(--n-pink),0 0 26px var(--n-pink)}
.logo + .tag{margin-top:8px}
.logo canvas.ice{position:absolute;pointer-events:none}
.logo canvas.ice:last-of-type{animation:neonFlick 9s linear infinite}
@keyframes neonFlick{0%,88%,90.5%,92%,100%{opacity:1}89%{opacity:.35}91%{opacity:.5}91.5%{opacity:.2}}
.logo.iced span{color:transparent;-webkit-text-fill-color:transparent;text-shadow:none}
.tag{background:none;color:var(--n-yellow);text-shadow:0 0 6px var(--n-yellow),0 0 16px rgba(255,228,90,.6)}
/* кнопки: стеклянная плашка с неоновой трубкой */
.btn{--nc:var(--n-pink)}
.btn.ghost{--nc:var(--n-green)}
.btn.slime{--nc:var(--n-yellow)}
.btn,.btn.ghost,.btn.slime{background:var(--glass);border:3px solid var(--tube);border-radius:999px;color:#fff;
  text-shadow:0 0 6px var(--nc),0 0 16px var(--nc);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:0 0 8px var(--nc),0 0 24px var(--halo),inset 0 0 12px var(--halo)}
.btn::before,.btn::after{display:none}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.96);box-shadow:0 0 12px var(--nc),0 0 34px var(--nc),inset 0 0 18px var(--halo)}
.ib{--nc:var(--n-cyan);background:var(--glass);border:2.5px solid var(--tube);color:var(--nc);box-shadow:0 0 8px var(--nc),inset 0 0 8px var(--halo)}
.ib svg{filter:drop-shadow(0 0 3px var(--nc))}
.ib:hover{box-shadow:0 0 14px var(--nc),0 0 26px var(--halo),inset 0 0 10px var(--halo)}
#bSound{--nc:var(--n-yellow)}#bMusic{--nc:var(--n-violet)}#bHome{--nc:var(--n-green)}#bShopX,#bPanelX{--nc:var(--n-pink)}
.ib.off{--nc:#8f7fb0;box-shadow:none;color:rgba(240,228,255,.45)}
.ib.off svg{filter:none}
/* плашки и счётчики */
.chip{--nc:var(--n-cyan);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 8px var(--nc),inset 0 0 8px var(--halo)}
.chip .lv{color:var(--n-yellow);text-shadow:0 0 6px rgba(255,228,90,.7)}
.chip .nm{text-shadow:0 0 8px var(--n-cyan)}
.candy{--nc:var(--n-yellow);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 8px var(--nc),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--n-yellow)}
.meter{--nc:var(--n-pink);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo)}
.meter .fill{background:linear-gradient(90deg,#3dff9a 0%,#22e5ff 35%,#b06bff 62%,#ff4fd8 82%,#ff3d5a 100%);background-size:540px 100%;box-shadow:0 0 10px rgba(255,79,216,.6),inset 0 2px 0 rgba(255,255,255,.4)}
.meter .ml,.meter .mv{text-shadow:0 0 4px #000,0 0 8px #000}
@keyframes throb{50%{box-shadow:0 0 30px #ff3d5a,inset 0 0 12px rgba(255,61,90,.6);border-color:#ff9aac}}
.stam .bar{background:rgba(176,107,255,.2);box-shadow:0 0 6px rgba(34,229,255,.4)}
.stam .bar i{background:var(--n-cyan);box-shadow:0 0 8px var(--n-cyan)}
.hint{--nc:var(--n-violet);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo)}
.bubble{--nc:var(--n-pink);background:var(--glass);color:#fff;border:2.5px solid var(--tube);box-shadow:0 0 10px var(--nc),0 0 22px var(--halo),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc)}
.bubble::after{border-top-color:var(--tube)}
.tag2{--nc:var(--n-violet);background:var(--glass);border:1.5px solid color-mix(in srgb,var(--nc) 45%,transparent)}
.event{--nc:var(--n-yellow);background:var(--glass);border:2px solid var(--tube);color:#fff;box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc)}
.lang{--nc:var(--n-violet);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 6px var(--halo)}
.shopbtn{--nc:var(--n-pink)}.qbtn{--nc:var(--n-green)}.bgsw{--nc:var(--n-cyan)}
.bgsw b,.lang span.on{color:var(--n-yellow);text-shadow:0 0 6px rgba(255,228,90,.7)}
.combo{--nc:var(--n-yellow);background:var(--glass);border:2px solid var(--tube);color:#fff;box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc),0 0 14px var(--nc)}
.x2{--nc:var(--n-yellow);background:var(--glass);border:2.5px solid var(--tube);color:#fff;box-shadow:0 0 10px var(--nc),0 0 22px var(--halo),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc)}
/* карточка уровня, магазин и окна */
.card{--nc:var(--n-pink);background:radial-gradient(circle at 50% 0%,rgba(176,107,255,.28),transparent 70%),rgba(16,5,34,.88);border:3px solid var(--tube);box-shadow:0 0 14px var(--nc),0 0 44px var(--halo),inset 0 0 16px var(--halo)}
.card .cl{color:var(--n-yellow);text-shadow:0 0 6px rgba(255,228,90,.7)}
.card .cn{color:#fff;text-shadow:0 0 10px var(--n-pink),0 0 26px var(--n-pink)}
.card .cs b{color:var(--n-cyan)}
.shop{background:rgba(8,2,20,.72)}
.shop-box{--nc:var(--n-pink);background:radial-gradient(circle at 50% 0%,rgba(176,107,255,.24),transparent 60%),#120626;border:3px solid var(--tube);box-shadow:0 0 14px var(--nc),0 0 40px var(--halo),inset 0 0 14px var(--halo)}
.shop-head h2{color:#fff;text-shadow:0 0 8px var(--n-yellow),0 0 22px var(--n-yellow)}
.ptitle{color:var(--n-yellow);text-shadow:0 0 6px rgba(255,228,90,.6)}
.tab{--nc:var(--n-violet);background:var(--glass);border:2px solid color-mix(in srgb,var(--nc) 55%,transparent);color:var(--bone-soft)}
.tab.on{--nc:var(--n-pink);background:color-mix(in srgb,var(--nc) 22%,var(--glass));border-color:var(--tube);color:#fff;box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc)}
.item,.day,.quest,.toprow{--nc:var(--n-violet);background:rgba(30,10,60,.55);border:2px solid color-mix(in srgb,var(--nc) 40%,transparent)}
.item.on,.quest.done,.toprow.me{--nc:var(--n-cyan);border-color:var(--tube);box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo)}
.day.today{--nc:var(--n-pink);border-color:var(--tube);background:rgba(255,79,216,.14);box-shadow:0 0 12px var(--nc),inset 0 0 8px var(--halo)}
.item canvas,.album canvas{background:rgba(6,2,16,.55)}
.ibtn{--nc:var(--n-yellow);background:var(--glass);border:2px solid var(--tube);color:#fff;box-shadow:0 0 8px var(--nc),inset 0 0 6px var(--halo);text-shadow:0 0 6px var(--nc)}
.ibtn:active:not(:disabled){transform:scale(.95);box-shadow:0 0 14px var(--nc),inset 0 0 8px var(--halo)}
.ibtn:disabled{background:rgba(255,255,255,.06);border-color:rgba(240,228,255,.2);box-shadow:none;text-shadow:none}
.qbar{background:rgba(176,107,255,.2)}
.qbar i{background:linear-gradient(90deg,var(--n-pink),var(--n-cyan));box-shadow:0 0 8px var(--n-cyan)}
.qpay{color:var(--n-yellow)}
.toprow .ts{color:var(--n-yellow)}
.qtoast{--nc:var(--n-cyan);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 10px var(--nc),inset 0 0 8px var(--halo);text-shadow:0 0 6px var(--nc)}
.toast{--nc:var(--n-cyan);background:rgba(16,5,34,.92);color:#fff;border:2px solid var(--tube);box-shadow:0 0 10px var(--nc)}
.epi-candy{--nc:var(--n-pink);background:var(--glass);border:2px solid var(--tube);box-shadow:0 0 8px var(--nc)}
#bShop.deal::after,#bShop2.deal::after{background:var(--n-cyan);border-color:#fff}
/* 1.4.0: цель ёлки, звёзды за уровень, гость недели, адвент-календарь */
.goal{margin:8px 0 0;padding:5px 14px;border-radius:999px;background:var(--glass);border:1.5px solid rgba(61,255,154,.5);font-weight:800;font-size:.85rem;line-height:1.3;color:#eafff2;text-shadow:0 0 6px rgba(61,255,154,.6);text-align:center;text-wrap:balance;pointer-events:none;max-width:34rem}
.grave-ui .goal{margin:0}
.epi-stars{display:block;margin-top:2px;font-family:var(--font-ui);font-size:1.4rem;letter-spacing:.14em;color:#ffe45a;text-shadow:0 0 8px rgba(255,228,90,.8)}
#bGuest{--nc:var(--n-yellow)}#bAdvent{--nc:var(--n-pink)}
#bGuest.deal,#bAdvent.deal{position:relative}
#bGuest.deal::after,#bAdvent.deal::after{content:'';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--n-cyan);border:2px solid #fff;box-shadow:0 0 10px var(--n-cyan)}
.adv{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:27rem;margin:6px auto}
.advd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;aspect-ratio:1;border-radius:10px;background:rgba(30,10,60,.55);border:2px solid rgba(176,107,255,.35);font-size:.75rem;color:var(--bone-soft)}
.advd b{font-weight:900;color:var(--bone);line-height:1}.advd canvas{width:52%;height:auto}
.advd.got{border-color:rgba(61,255,154,.65)}.advd.today{border-color:var(--n-pink);box-shadow:0 0 12px var(--n-pink);background:rgba(255,79,216,.16)}.advd.miss{opacity:.38}
.advs{color:var(--n-yellow);font-weight:900}
.advhat{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:.85rem;color:var(--bone-soft)}.advhat canvas{width:60px;height:60px}
</style>
</head>

</div>

    <button class="ib" id="bSound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="ib" id="bMusic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.5" fill="currentColor"/></svg></button>
    <button class="ib" id="bHome" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V10a6 6 0 0 1 12 0v11"/><path d="M4 21h16"/><path d="M12 8v6M9.5 10.5h5"/></svg></button>
  </div>
  <div class="hud-row2"><div class="candy" id="candy"><svg viewBox="0 0 32 20" aria-hidden="true"><path d="M7 10 1 3v14z M25 10l6-7v14z" fill="#ff8cc0" stroke="#5a0f33" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="16" cy="10" rx="10" ry="8" fill="#ff4f8b" stroke="#5a0f33" stroke-width="1.5"/><path d="M11 3.5 14 17M17 2.5 20 16.5" stroke="#fff" stroke-width="2" opacity=".85"/><ellipse cx="12.5" cy="6.5" rx="3" ry="1.6" fill="#fff" opacity=".7"/></svg><b id="candyN">0</b></div><div class="meter" id="meter" hidden><div class="fill" id="fill"></div><span class="ml" id="ml"></span><span class="mv" id="mv">0%</span></div><div class="combo" id="combo" hidden>×2</div></div>

    <div class="title-opts"><button class="lang" id="bGuest" type="button" hidden></button><button class="lang" id="bAdvent" type="button" hidden></button><button class="lang shopbtn" id="bShop" type="button"></button><button class="lang qbtn" id="bQuest" type="button"></button><button class="lang" id="bTop" type="button" hidden></button><button class="lang" id="bHelp" type="button" hidden></button><button class="lang bgsw" id="bBg2" type="button"></button><button class="lang" id="bLang" type="button"><span data-l="ru">Русский</span> · <span data-l="en">English</span></button></div>
  </div>

  <div class="row" id="graveBtns"><button class="btn slime" id="bNext" type="button"></button><button class="btn ghost" id="bShop2" type="button"></button><button class="btn ghost" id="bQuest2" type="button"></button><button class="btn ghost" id="bMenu" type="button"></button><button class="btn ghost" id="bShare" type="button" hidden></button><button class="btn ghost" id="bInvite" type="button" hidden></button></div>

/* ================= 1.2.0: неоновые фоны =================

// сколько всего можно собрать и сколько уже есть — счётчик коллекции в магазине

  const items = SHOP.tab === 'hats' ? [...HATS.map(h => ({ kind: 'hat', id: h.id, name: h[LANG], price: h.price, owned: own('hat:' + h.id), on: META.equip === h.id })),
      ...SECRET_HATS.map(h => ({ kind: 'hat', id: h.id, secret: true, name: own('hat:' + h.id) ? h[LANG] : T.secretName, owned: own('hat:' + h.id), on: META.equip === h.id })),
      { kind: 'hat', id: ADVENT_HAT.id, secret: true, lock: T.advHatLock, name: own('hat:' + ADVENT_HAT.id) ? ADVENT_HAT[LANG] : T.secretName, owned: own('hat:' + ADVENT_HAT.id), on: META.equip === ADVENT_HAT.id },

  const grid = $('shopGrid'); grid.innerHTML = '';

<script>
"use strict";
/* ================= 1.0.8: подарок дня, новогодние каникулы, задания, золотые дамплинги, ×2 за рекламу, рекорды =================
   Всё, что игрок получает здесь, — конфеты и шляпки; прогресс хранится там же, где остальное (ключи daily, quests, gold). */
const elx = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/* --- новогодние каникулы: с 24 декабря до конца 8 января все конфеты за игру, задания и подарки удваиваются;
       до них на заставке идёт отсчёт дней до Нового года --- */
const EVENT_START = new Date(2026, 11, 24).getTime(), EVENT_END = new Date(2027, 0, 9).getTime(), NEW_YEAR = new Date(2027, 0, 1).getTime();
const eventOn = () => Date.now() >= EVENT_START && Date.now() < EVENT_END;
const eventMul = () => eventOn() ? 2 : 1;
const earnMul = () => sweetMul() * eventMul();
function eventLeft() { const h = Math.floor(Math.max(0, EVENT_END - Date.now()) / 3600000); return { d: Math.floor(h / 24), h: h % 24 }; }
function eventLabel() {
  const e = $('eventBanner'), t = Date.now();
  if (eventOn()) { const l = eventLeft(); e.hidden = false; e.textContent = L().eventOn(l.d, l.h); }
  else if (t < NEW_YEAR) { e.hidden = false; e.textContent = L().countdown(Math.ceil((NEW_YEAR - t) / 86400000)); }

}

/* --- всплывающая строка «задание выполнено» --- */
function qToast(s) { const t = $('qtoast'); t.textContent = s; t.classList.add('show'); clearTimeout(qToast.tm); qToast.tm = setTimeout(() => t.classList.remove('show'), 2400); }


/* ================= 1.4.0: удержание — подарки под ёлкой, адвент-календарь, друзья ================= */
// подарок за время в игре: через 2,5 минуты активной игры (потом каждые 3) под ёлкой появляется подарок
const SESS = { t: 0, need: 150, ready: false };
function stepSess(dt) { SESS.t += dt; if (!SESS.ready && SESS.t >= SESS.need) { SESS.ready = true; qToast(L().sessReady); } }
function claimSess(x, y) {

const mmss = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
// подарки, пока игрока нет: каждые 4 часа по подарку, копится до трёх

function awayInfo() { let g = store.get('gifts', null); if (!g || !g.t) { g = { t: Date.now() }; store.set('gifts', g); } return g; }

}
// подписи цели ёлки — на заставке и под ёлкой
function goalLabels() {

  const g = $('goal'); if (g) { g.hidden = !n; g.textContent = txt; }
  const g2 = $('goal2'); if (g2) { g2.hidden = !n; g2.textContent = txt; }
}
// адвент-календарь: с 1 по 31 декабря каждый день открывается окошко — конфеты и игрушка на ёлку; за 25 окошек — новогодний венок
const ADV = { y: 2026, m: 11, need: 25 };
const ADVENT_HAT = { id: 'wreath', ru: 'Новогодний венок', en: 'Holiday wreath' };
function advInfo() {

  return { inDec, day, open, avail: inDec && !open.includes(day), before: d.getTime() < new Date(ADV.y, ADV.m, 1).getTime(), shown: d.getTime() < new Date(ADV.y + 1, 0, 9).getTime() };
}
const advPay = d => Math.round((20 + d * 2) * eventMul());
function claimAdvent() {

  const pay = advPay(a.day); addCandy(pay, SC.W / 2, SC.H * 0.5); floatText(SC.W / 2, SC.H * 0.45, '+' + pay, '#ffe45a', 34); SND.bell();
  if (open.length >= ADV.need && !META.owned.has('hat:' + ADVENT_HAT.id)) { META.owned.add('hat:' + ADVENT_HAT.id); saveOwned(); showCard(L().advent, ADVENT_HAT[LANG], '', 2600); }

// игрушка календаря: шарик или звёздочка (каждый пятый день)
const ADV_COLS = ['#ff4b55', '#ffd23a', '#4fa8ff', '#ff7ad1', '#7dff9a', '#b06bff'];

// места игрушек календаря на ёлке (в координатах ёлки)
const ADV_SLOTS = (() => {
  const cells = []; [[0.4, 2], [0.65, 4], [0.9, 5]].forEach(([v, n]) => { for (let p = 0; p < n; p++) cells.push([v, (p + 0.5) / n]); });

  return Array.from({ length: 31 }, (_, i) => { const [top, bot, hw] = TIERS[i % 3], [v0, u0] = cells[perm[Math.floor(i / 3)]], v = v0 + Math.sin(i * 12.99) * 0.035, u = u0 + Math.cos(i * 78.23) * 0.05; return [TCX + (u * 2 - 1) * hw * v * 0.82, top + (bot - top) * v]; });

function renderAdvent(body) {

/* --- подарок дня: растёт, если заходить подряд; на 7-й день — корона Снежной королевы --- */
const DAILY_PAY = [30, 45, 60, 80, 100, 130, 200];
const DAILY_HAT = { id: 'pumpking', ru: 'Корона Снежной королевы', en: 'Snow Queen crown' };
function dailyInfo() {

/* --- задания на день: три из списка, одни и те же у всех в этот день; за все три — сундук --- */
const QUEST_POOL = [
  { id: 'pop', need: [6, 10], pay: 50 }, { id: 'combo', need: [3, 5], pay: 60 }, { id: 'bonus', need: [30, 50], pay: 60 },
  { id: 'gift', need: [1, 2], pay: 70 }, { id: 'mini', need: [4, 6], pay: 50 }, { id: 'boss', need: [1, 1], pay: 70 },
  { id: 'fast', need: [2, 3], pay: 60 }, { id: 'web', need: [2, 3], pay: 40 }, { id: 'buy', need: [1, 1], pay: 40 }

const QUEST_CHEST = 150;
const questPay = id => Math.round(QUEST_POOL.find(q => q.id === id).pay * eventMul());
function questsToday() {
  let Q = store.get('quests', null); const today = dayKey();
